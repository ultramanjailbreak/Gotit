name: Build PS4 Payload

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PS4 Payload
        uses: Scene-Collective/ps4-payload-sdk@v1
        with:
          app_path: .
          build_command: make

      - name: List build output
        run: |
          echo "Build completed."
          find . -maxdepth 3 -type f \
            \( -name "*.bin" -o -name "*.elf" \) \
            -print
