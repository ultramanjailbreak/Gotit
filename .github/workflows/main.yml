name: Build PS4 Payload

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: Scene-Collective/ps4-payload-sdk@v1.0.0
        with:
          app_path: .
          build_command: make

      - name: Find build output
        run: |
          echo "Build output:"
          find . -type f \( -name "*.bin" -o -name "*.elf" \) -print

      - name: Prepare payload
        run: |
          set -e

          PAYLOAD=$(find . -type f -name "payload.bin" | head -n 1)

          if [ -z "$PAYLOAD" ]; then
            echo "ERROR: payload.bin was not found."
            echo "All .bin files:"
            find . -type f -name "*.bin" -print
            exit 1
          fi

          echo "Found payload: $PAYLOAD"
          cp "$PAYLOAD" ./payload.bin

          ls -lh ./payload.bin

      - name: Upload payload
        uses: actions/upload-artifact@v4
        with:
          name: ps4-payload
          path: payload.bin
          if-no-files-found: error
